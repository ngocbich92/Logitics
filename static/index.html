<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ theo dõi NVL</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2733;--mut:#6b7885;--line:#dde3ea;--pri:#1f4e78;--ok:#1a7f4b;--warn:#b25e00;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1a2128;--ink:#e6ebf0;--mut:#93a1af;--line:#2b3641;--pri:#5aa2dd;--ok:#4cc38a;--warn:#e0a040;--bad:#ef6b5b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
nav button{background:transparent;border:0;color:#fff;opacity:.75;font:inherit;padding:6px 12px;cursor:pointer;border-radius:6px}
nav button.on{opacity:1;background:rgba(255,255,255,.18)}
main{padding:16px 20px;max-width:1400px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{color:var(--mut);font-size:12px}.card .v{font-size:22px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:62vh;overflow:auto}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button.b{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.b.g{background:transparent;color:var(--pri)}button.b.d{border-color:var(--bad);background:transparent;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
#msg{position:fixed;right:16px;bottom:16px;max-width:420px;padding:10px 14px;border-radius:8px;background:var(--ink);color:var(--bg);display:none;z-index:9}
tr.sub td{background:rgba(127,127,127,.06);font-size:12px;color:var(--mut)}
.hide{display:none}
@media print{header,#side,.noprint,#msg{display:none!important}body{background:#fff}main{padding:0;max-width:none}.panel{border:0}}
#rvform th,#rvform td{border:1px solid #999}
#gtb td,#gtb th,#gridbox td{white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}

/* ===== Bố cục: thanh điều hướng dọc, 2 hệ thống ===== */
body{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:var(--pri);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 0 24px}
#side .brand{padding:4px 16px 12px;font-weight:600;font-size:15px;line-height:1.3}
#side .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
#side .grp{margin-top:6px}
#side .gh{display:flex;align-items:center;gap:8px;width:100%;background:rgba(0,0,0,.18);border:0;color:#fff;font:inherit;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:9px 16px;cursor:pointer;text-align:left}
#side .gh .ar{margin-left:auto;transition:transform .15s}
#side .grp.closed .ar{transform:rotate(-90deg)}
#side .grp.closed .items{display:none}
#side .items button{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;color:#fff;opacity:.82;font:inherit;padding:8px 16px 8px 22px;cursor:pointer}
#side .items button:hover{background:rgba(255,255,255,.1);opacity:1}
#side .items button.on{background:rgba(255,255,255,.2);border-left-color:#fff;opacity:1;font-weight:600}
main{flex:1;min-width:0;margin:0;max-width:none;width:100%}
@media(max-width:820px){body{flex-direction:column}#side{width:auto;height:auto;position:static;padding-bottom:8px}}
@media print{#side{display:none!important}}
.bar{height:14px;background:var(--pri);border-radius:3px;min-width:2px}
.obmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.obmodal .box{background:var(--card);color:var(--ink);border-radius:10px;max-width:1100px;width:100%;padding:16px}
.obf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.obf label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
.obf textarea,.obf input{width:100%}
.tag.logs{border-color:#2f7ec7;color:#2f7ec7}.tag.wh{border-color:#b25e00;color:#b25e00}

.obmodal .box{max-width:1280px}
.obsec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
.obsh{font-weight:600;margin-bottom:6px;color:var(--pri)}
.obg{display:grid;gap:8px}
.obg label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;min-width:0}
.obg label.tall{grid-column:span 1}
.obg input,.obg textarea{width:100%}
.obg.compact input{font-size:12px;padding:4px 6px}
</style>
</head>
<body>
<aside id="side"><div class="brand">Polarium Logistics<small>Hệ thống quản lý vận hành</small></div><nav id="nav"></nav></aside>
<main id="main"></main>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:4});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={CO:'C/O',XK:'Xuất khẩu',MDK:'Mục đích khác',TH:'Tiêu huỷ'};
function toast(t,bad){const m=$('#msg');m.textContent=t;m.style.background=bad?'var(--bad)':'var(--ink)';m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',bad?7000:3500)}
async function api(p,opt){const r=await fetch(p,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const post=(p,o)=>api(p,{method:'POST',body:JSON.stringify(o||{})});
async function upload(p,file){return api(p,{method:'POST',body:await file.arrayBuffer()})}
/* ===== Bảng có lọc theo từng cột ===== */
let stockMode='line';
const HINT={number:'vd: >100, 5..20, =3',date:'2026-09 hoặc 01/09/2026..30/09/2026',text:'chứa · =chính xác · !loại trừ · a|b'};
function parseNum(s){return parseFloat(String(s).replace(',','.'))}
function matchNum(v,t){t=t.trim();if(!t)return true;if(v==null||v==='')return false;let m;
  if(m=t.match(/^(-?[\d.,]+)\s*\.\.\s*(-?[\d.,]+)$/))return v>=parseNum(m[1])&&v<=parseNum(m[2]);
  if(m=t.match(/^(>=|<=|>|<|=)\s*(-?[\d.,]+)$/)){const x=parseNum(m[2]);return {'>=':v>=x,'<=':v<=x,'>':v>x,'<':v<x,'=':v==x}[m[1]]}
  if(/^-?[\d.,]+$/.test(t))return v==parseNum(t);return String(v).includes(t)}
const fold=s=>String(s??'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'');
function matchText(v,t){t=t.trim();if(!t)return true;const f=fold(v);
  if(t[0]==='=')return t.slice(1).split('|').some(x=>f===fold(x));
  if(t[0]==='!')return !t.slice(1).split('|').filter(x=>x.trim()).some(x=>f.includes(fold(x)));
  return t.split('|').filter(x=>x.trim()).some(x=>f.includes(fold(x)))}
function miniTable(box,cols,rows,defSort,opt){
  opt=opt||{};const PG=opt.pageSize||200;
  const S={f:{},sort:defSort||null,dir:'desc',page:1};
  box.innerHTML=`<div class="row"><span class="mut" id="mt_n"></span>${opt.csv?`<button class="b g" id="mt_csv">⬇ Xuất Excel/CSV (đang lọc)</button>`:''}<span id="mt_pg"></span></div><div class="scroll"><table><thead><tr>${cols.map((c,i)=>`<th class="${c.t==='number'?'n':''}" style="cursor:pointer;white-space:nowrap" data-s="${i}">${esc(c.l)}</th>`).join('')}</tr>
   <tr>${cols.map((c,i)=>`<th><input data-f="${i}" placeholder="${HINT[c.t]||HINT.text}" style="width:100%;min-width:70px;font-size:12px"></th>`).join('')}</tr></thead><tbody></tbody></table></div>`;
  const filtered=()=>{let r=rows.filter(x=>cols.every((c,i)=>{const t=S.f[i];return !t||(c.t==='number'?matchNum(x[c.k],t):matchText(x[c.k],t))}));
    if(S.sort){const c=cols.find(c=>c.k===S.sort);r=[...r].sort((a,b)=>{const x=a[c.k],y=b[c.k];return (x==null)-(y==null)||(x>y?1:x<y?-1:0)}); if(S.dir==='desc')r.reverse()}return r};
  const draw=()=>{const r=filtered();const pages=Math.max(1,Math.ceil(r.length/PG));if(S.page>pages)S.page=pages;
    $('#mt_n').textContent=`${fmt(r.length)} / ${fmt(rows.length)} dòng`;
    $('#mt_pg').innerHTML=pages>1?`<button class="b g" data-p="-1" ${S.page<=1?'disabled':''}>‹</button> Trang ${S.page}/${pages} <button class="b g" data-p="1" ${S.page>=pages?'disabled':''}>›</button>`:'';
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.page+=+b.dataset.p;draw()});
    box.querySelector('tbody').innerHTML=r.slice((S.page-1)*PG,S.page*PG).map(x=>'<tr'+(opt.rowAttr?opt.rowAttr(x):'')+'>'+cols.map(c=>`<td class="${c.t==='number'?'n':''}" title="${esc(x[c.k]??'')}">${c.b?'<b>':''}${c.t==='number'?fmt(x[c.k]):esc(String(x[c.k]??'').slice(0,c.w?90:60))}${c.b?'</b>':''}</td>`).join('')+'</tr>').join('')};
  box.querySelectorAll('[data-f]').forEach(i=>i.addEventListener('input',()=>{S.f[i.dataset.f]=i.value;S.page=1;draw()}));
  box.querySelectorAll('[data-s]').forEach(h=>h.addEventListener('click',()=>{const k=cols[h.dataset.s].k;S.dir=(S.sort===k&&S.dir==='desc')?'asc':'desc';S.sort=k;draw()}));
  if(opt.csv)$('#mt_csv').onclick=()=>{const r=filtered();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const csv='﻿'+[cols.map(c=>q(c.l)).join(','),...r.map(x=>cols.map(c=>c.t==='number'&&x[c.k]!=null?x[c.k]:q(x[c.k])).join(','))].join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=(opt.csv||'du-lieu')+'.csv';a.click()};
  draw();
}

/* ===== Lưới server-side: mọi cột lọc / sắp xếp / xuất Excel ===== */
const G={raw:false,def:[],filters:{},q:'',sort:'',dir:'asc',page:1,size:100,cols:null,all:[],total:0};
const gKey=()=>G.raw?'nvlColsRaw':'nvlCols3';
function resetG(raw){if(G.raw!==raw){G.raw=raw;G.filters={};G.q='';G.sort='';G.page=1;G.cols=null}}
async function mountGrid(box){
  const meta=await api('/api/grid/columns'+(G.raw?'?raw=1':''));G.all=meta.columns;G.def=meta.default;
  try{G.cols=JSON.parse(localStorage[gKey()]||'null')}catch(e){G.cols=null}
  if(!G.cols||!G.cols.every(c=>G.all.some(a=>a.name===c)))G.cols=meta.default.filter(c=>G.all.some(a=>a.name===c));
  box.innerHTML=`<div class="row"><input id="gq" placeholder="Tìm nhanh trong mọi cột…" size="30" value="${esc(G.q)}">
    <details><summary class="b g" style="display:inline-block;list-style:none;cursor:pointer;padding:6px 12px;border:1px solid var(--pri);border-radius:6px;color:var(--pri)">Chọn cột (${G.cols.length}/${G.all.length})</summary>
     <div style="position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:60vh;overflow:auto;width:340px">
     <input id="cq" placeholder="Tìm cột…" style="width:100%;margin-bottom:6px"><div id="clist"></div></div></details>
    <select id="gsz"><option>50</option><option selected>100</option><option>200</option><option>500</option></select>
    ${G.raw?'<select id="gton" style="display:none"></select>':'<select id="gton" title="Lọc theo số lượng tồn"><option value="">Tồn: tất cả</option><option value=">0">Chỉ còn tồn</option><option value="=0">Đã hết</option></select>'}
    <button class="b g" onclick="gAllCols(true)">Hiện tất cả cột</button>${G.raw?'':'<button class="b g" onclick="gAllCols(false)">Cột chính</button>'}<button class="b g" onclick="gClear()">Xoá lọc</button><button class="b g" onclick="gExport()">⬇ Xuất Excel (kết quả đang lọc)</button>
    <span class="mut" id="gcnt"></span></div>
   <div class="scroll" id="gtb"></div><div class="row" id="gpg" style="margin-top:8px"></div>`;
  $('#gsz').value=G.size;
  const cl=()=>{const t=fold($('#cq').value);$('#clist').innerHTML=G.all.filter(c=>fold(c.name).includes(t)).map(c=>`<label style="display:block"><input type="checkbox" data-c="${esc(c.name)}" ${G.cols.includes(c.name)?'checked':''}> ${esc(c.name)} <span class="mut">${c.type}</span></label>`).join('');
    $('#clist').querySelectorAll('input').forEach(i=>i.onchange=()=>{const n=i.dataset.c;G.cols=i.checked?[...G.cols,n]:G.cols.filter(x=>x!==n);G.cols=G.all.map(a=>a.name).filter(x=>G.cols.includes(x));localStorage[gKey()]=JSON.stringify(G.cols);G.cols.length||G.cols.push(n);gLoad(true)})};
  $('#cq').oninput=cl;cl();
  let tm;$('#gq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{G.q=e.target.value;G.page=1;gLoad()},350)};
  $('#gsz').onchange=e=>{G.size=+e.target.value;G.page=1;gLoad()};
  $('#gton').onchange=e=>{if(e.target.value)G.filters['Tồn (hệ thống)']=e.target.value;else delete G.filters['Tồn (hệ thống)'];G.page=1;gLoad(true)};
  await gLoad(true);
}
function gParams(extra){return new URLSearchParams({filters:JSON.stringify(G.filters),q:G.q,sort:G.sort,dir:G.dir,page:G.page,size:G.size,cols:JSON.stringify(G.cols),...extra}).toString()}
async function gLoad(rebuildHead){
  const r=await api('/api/grid?'+gParams());G.total=r.total;
  const types=Object.fromEntries(G.all.map(c=>[c.name,c.type]));
  const head=()=>`<table><thead><tr>${r.columns.map(c=>`<th class="${types[c]==='number'?'n':''}" style="cursor:pointer;white-space:nowrap" data-s="${esc(c)}">${esc(c)}${G.sort===c?(G.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')}</tr>
    <tr>${r.columns.map((c,i)=>`<th><input data-f="${esc(c)}" list="dl${i}" value="${esc(G.filters[c]||'')}" placeholder="${HINT[types[c]]}" style="width:100%;min-width:90px;font-size:12px"><datalist id="dl${i}"></datalist></th>`).join('')}</tr></thead><tbody id="gbody"></tbody></table>`;
  if(rebuildHead||!$('#gbody')){$('#gtb').innerHTML=head();
    $('#gtb').querySelectorAll('[data-f]').forEach(i=>{let t;i.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{G.filters[i.dataset.f]=i.value;G.page=1;gLoad()},400)});
      i.addEventListener('focus',async()=>{if(i.list.dataset.ok)return;i.list.dataset.ok=1;const d=await api('/api/grid/distinct?'+gParams({col:i.dataset.f}));i.list.innerHTML=d.slice(0,200).map(x=>`<option value="${esc(x.v)}">${x.n}</option>`).join('')})});
    $('#gtb').querySelectorAll('[data-s]').forEach(h=>h.addEventListener('click',()=>{const c=h.dataset.s;G.dir=(G.sort===c&&G.dir==='asc')?'desc':'asc';G.sort=c;gLoad(true)}))}
  const ti=r.columns.map(c=>types[c]);
  const ri=r.columns.indexOf('Tồn (hệ thống)');
  $('#gbody').innerHTML=r.rows.map((row,k)=>`<tr${ri>=0&&row[ri]<=0?' style="opacity:.55"':''}>`+row.map((v,i)=>r.columns[i]==='Ghi chú (nhập tay)'?
    `<td><input class="gnote" data-id="${r.ids[k]}" value="${esc(v||'')}" placeholder="…" style="min-width:220px;font-size:12px"></td>`:
    `<td class="${ti[i]==='number'?'n':''}" title="${v==null?'':esc(v)}">${v==null?'':ti[i]==='number'?fmt(v):esc(String(v).slice(0,300))}</td>`).join('')+'</tr>').join('')||`<tr><td class=mut>Không có dòng nào khớp bộ lọc</td></tr>`;
  $('#gbody').querySelectorAll('.gnote').forEach(inp=>inp.onchange=async()=>{try{await post(`/api/lines/${inp.dataset.id}/note`,{note:inp.value});toast('Đã lưu ghi chú')}catch(e){toast(e.message,1)}});
  const pages=Math.max(1,Math.ceil(r.total/G.size));
  $('#gcnt').textContent=G.raw?`${fmt(r.total)} dòng khớp`:`${fmt(r.total)} dòng khớp · ${fmt(r.summary.con_ton)} còn tồn · ${fmt(r.summary.het)} đã hết · ${fmt(r.summary.da_dung)} đã bị trừ lùi`;
  $('#gton').value=G.filters['Tồn (hệ thống)']||'';
  $('#gpg').innerHTML=`<button class="b g" ${G.page<=1?'disabled':''} onclick="G.page--;gLoad()">‹</button><span>Trang ${G.page}/${pages}</span><button class="b g" ${G.page>=pages?'disabled':''} onclick="G.page++;gLoad()">›</button>`;
}
function gAllCols(all){G.cols=all?G.all.map(c=>c.name):G.def.filter(c=>G.all.some(a=>a.name===c));localStorage[gKey()]=JSON.stringify(G.cols);go(cur)}
function gClear(){G.filters={};G.q='';G.page=1;const q=$('#gq');if(q)q.value='';gLoad(true)}
function gExport(){location.href='/export/grid.xlsx?'+gParams()}

/* ===== Nạp lô cũ theo tờ khai chỉ định ===== */
let LOT=null;
const lotOpts=()=>({stage:LOT,kind:$('#lkind').value,frozen:$('#lfrozen').checked,replace:$('#lrepl').checked});
async function lotPreview(){const f=$('#flot').files[0];if(!f)return toast('Chọn file trước',1);
  $('#lotlog').innerHTML='<p class="warn">Đang đọc file…</p>';
  try{const r=await upload('/api/lots/preview',f);LOT=r.stage;await lotCheck()}catch(e){$('#lotlog').innerHTML='';toast(e.message,1)}}
async function lotCheck(){
  const r=await post('/api/lots/apply',{...lotOpts(),dry:true});
  const err=r.problems.filter(p=>p.level!=='warn'),warn=r.problems.filter(p=>p.level==='warn');
  const row=p=>`<tr><td class=n>${p.row}</td><td>${esc(p.lot)}</td><td>${esc(p.so_tk)}</td><td>${esc(p.ma_hang)}</td><td class=n>${fmt(p.qty)}</td><td class="${p.level==='warn'?'warn':'bad'}">${esc(p.msg)}</td></tr>`;
  const tbl=(t,a,c)=>a.length?`<p class="${c}"><b>${t} (${a.length})</b></p><div class="scroll" style="max-height:30vh"><table><tr><th class=n>Dòng Excel</th><th>Lô</th><th>Số TK nhập</th><th>Mã hàng</th><th class=n>SL</th><th>Vấn đề</th></tr>${a.slice(0,300).map(row).join('')}</table></div>`:'';
  $('#lotlog').innerHTML=`<div class="panel" style="border-color:var(--warn)"><p>Kiểm tra (chưa lưu): <b>${r.lots.filter(l=>l.created).length}</b> lô sẽ được tạo, <b>${fmt(r.ok_rows)}</b>/${fmt(r.rows)} dòng hợp lệ.
   ${r.n_errors?`<span class="bad"><b>${r.n_errors} dòng lỗi sẽ bị bỏ qua</b></span> — sửa file rồi tải lại, hoặc lưu phần hợp lệ rồi nạp bổ sung phần còn lại (dùng "Thay thế lô cùng mã").`:'<span class="ok">Không có lỗi.</span>'}</p>
   <table><tr><th>Lô</th><th>Loại</th><th class=n>Dòng</th><th class=n>Hợp lệ</th><th></th></tr>${r.lots.map(l=>`<tr><td>${esc(l.lot)}</td><td>${KIND[l.kind]}</td><td class=n>${l.rows}</td><td class=n>${l.ok_rows}</td><td class=mut>${l.replaced?'thay thế lô cũ':''}${l.created?'':' (không tạo — không có dòng hợp lệ)'}</td></tr>`).join('')}</table>
   ${tbl('Lỗi',err,'bad')}${tbl('Cảnh báo (vẫn lưu)',warn,'warn')}

let PV=null;
let DBTOKEN=null;
async function dbPick(){

    $('#dbgo').disabled=false;
    if(!r.sheets.some(s=>s.looks_like_data))toast('Không sheet nào có đủ cột Số TK / Mã hàng / Số lượng — kiểm tra lại file',1);
  }catch(e){$('#dbsheet').innerHTML='';toast(e.message,1)}
}
async function dbPreview(){
  const f=$('#fdb').files[0];if(!f||!DBTOKEN)return toast('Chọn file và sheet trước',1);
  const box=$('#uplog');box.innerHTML='<p class="warn">Đang đọc sheet và phân tích… (file lớn mất khoảng 30–60 giây, đừng đóng trang)</p>';
  try{
    const full=$('#full').checked?1:0;
    const r=await post(`/api/import/database/preview?token=${DBTOKEN}&sheet=${encodeURIComponent($('#fsheet').value)}&filename=${encodeURIComponent(f.name)}&full=${full}`);
    PV={stage:r.stage,groups:r.groups,drop:new Set(r.drop),full:!!full,diff:r.diff,kind:'',q:''};
    renderReview();
  }catch(e){box.innerHTML='';toast(e.message,1)}
}
function reviewStats(){
  const g=PV.groups;return {n:g.length,ident:g.filter(x=>x.kind==='identical').length,diffs:g.filter(x=>x.kind==='differs').length,
    extra:g.reduce((a,x)=>a+x.n-1,0),dropRows:g.filter(x=>PV.drop.has(x.key)).reduce((a,x)=>a+x.n-1,0),
    unseen:g.filter(x=>x.prior==null).length}}
function filteredGroups(){const t=fold(PV.q);return PV.groups.filter(g=>(!PV.kind||g.kind===PV.kind)&&(!t||fold(g.so_tk+' '+g.ma_hang+' '+(g.ten_hang||'')).includes(t)))}
function renderReview(){
  const s=reviewStats(),d=PV.diff,box=$('#uplog');
  const list=filteredGroups();
  box.innerHTML=`<div class="panel" style="border-color:var(--warn)">
   <h2>Xem trước — chưa lưu gì vào hệ thống</h2>
   ${s.n?`<p class="warn"><b>⚠ Phát hiện ${fmt(s.n)} nhóm dòng trùng</b> (${fmt(s.extra)} dòng thừa): ${fmt(s.ident)} nhóm <b>giống hệt mọi cột</b> (thường là nhập trùng), ${fmt(s.diffs)} nhóm trùng Số TK + Mã hàng + Số lượng + Đơn giá nhưng <b>khác ở vài cột</b> (có thể là các dòng hàng khác nhau thật). Mặc định <b>giữ nguyên tất cả</b> — hãy chọn nhóm nào cần loại bỏ phần thừa.</p>`:'<p class="ok">Không phát hiện dòng trùng trong file.</p>'}
   <div id="pvdiff"></div>
   ${s.n?`<div class="row"><button class="b g" onclick="pvSet('identical',true)">Loại bỏ phần thừa của mọi nhóm GIỐNG HỆT</button><button class="b g" onclick="pvAll(false)">Giữ nguyên tất cả</button>
     <span class="mut">Lọc danh sách:</span><input id="pvq" placeholder="Số TK / mã hàng / tên hàng" value="${esc(PV.q)}" size="26">
     <select id="pvk"><option value="">Mọi loại</option><option value="identical" ${PV.kind==='identical'?'selected':''}>Giống hệt</option><option value="differs" ${PV.kind==='differs'?'selected':''}>Khác ở vài cột</option></select>
     <button class="b g" onclick="pvFiltered(true)">Loại bỏ thừa (${fmt(list.length)} nhóm đang lọc)</button><button class="b g" onclick="pvFiltered(false)">Giữ (đang lọc)</button></div>
   <div class="scroll" style="max-height:44vh"><table><tr><th>Quyết định</th><th>Số TK</th><th>Mã hàng</th><th class=n>Số lượng</th><th class=n>Đơn giá</th><th class=n>Số dòng</th><th>Loại</th><th>Khác ở cột</th><th>Đã xác nhận trước</th></tr>`+
    list.slice(0,300).map(g=>`<tr><td><select data-k="${esc(g.key)}"><option value="keep" ${PV.drop.has(g.key)?'':'selected'}>Giữ cả ${g.n} dòng</option><option value="drop" ${PV.drop.has(g.key)?'selected':''}>Chỉ giữ 1, bỏ ${g.n-1}</option></select></td>
     <td>${esc(g.so_tk)}</td><td title="${esc(g.ten_hang)}">${esc(g.ma_hang)}</td><td class=n>${fmt(g.qty)}</td><td class=n>${fmt(g.don_gia)}</td><td class=n>${g.n}</td>
     <td>${g.kind==='identical'?'<span class="tag bad">Giống hệt</span>':'<span class="tag warn">Khác cột</span>'}</td><td class="mut">${esc(g.diff_cols.join(', '))}</td><td class="mut">${g.prior==null?'—':g.prior===1?'Đã chọn bỏ thừa':'Đã chọn giữ'}</td></tr>`).join('')+
    (list.length>300?`<tr><td colspan=9 class=mut>Hiển thị 300/${fmt(list.length)} nhóm — dùng ô lọc để thu hẹp (các nút "đang lọc" áp dụng cho toàn bộ ${fmt(list.length)} nhóm).</td></tr>`:'')+`</table></div>`:''}
   <div class="row" style="margin-top:10px"><button class="b" onclick="pvCommit()">Xác nhận &amp; lưu vào hệ thống</button><button class="b d" onclick="PV=null;$('#uplog').innerHTML=''">Huỷ</button>
   <span class="mut">Đang chọn: loại bỏ <b>${fmt(s.dropRows)}</b> dòng thừa / giữ nguyên ${fmt(s.extra-s.dropRows)} dòng trùng</span></div></div>`;
  pvDiff();
  const q=$('#pvq');if(q){q.oninput=()=>{clearTimeout(q.t);q.t=setTimeout(()=>{PV.q=q.value;renderReview();$('#pvq').focus()},350)};$('#pvk').onchange=e=>{PV.kind=e.target.value;renderReview()}}
  box.querySelectorAll('select[data-k]').forEach(sel=>sel.onchange=()=>{sel.value==='drop'?PV.drop.add(sel.dataset.k):PV.drop.delete(sel.dataset.k);renderReview()});
}
function pvAll(drop){PV.drop=new Set(drop?PV.groups.map(g=>g.key):[]);renderReview()}
function pvSet(kind,drop){PV.groups.filter(g=>g.kind===kind).forEach(g=>drop?PV.drop.add(g.key):PV.drop.delete(g.key));renderReview()}
function pvFiltered(drop){filteredGroups().forEach(g=>drop?PV.drop.add(g.key):PV.drop.delete(g.key));renderReview()}
let pvT;
function pvDiff(){
  const show=d=>{const e=$('#pvdiff');if(!e)return;e.innerHTML=`<p>Kết quả nếu lưu: file còn <b>${fmt(d.rows_in_file)}</b> dòng${d.duplicates_dropped?` (đã bỏ ${fmt(d.duplicates_dropped)} dòng trùng)`:''} → thêm <b>${fmt(d.added)}</b>, cập nhật <b>${fmt(d.updated)}</b>, không đổi ${fmt(d.unchanged)}, xoá <b>${fmt(d.removed)}</b>${d.kept_because_already_allocated?`, <span class="warn">giữ lại ${fmt(d.kept_because_already_allocated)} dòng không còn trong file vì đã bị trừ lùi</span>`:''}.</p>`};
  if(PV.diffKey===[...PV.drop].sort().join()){show(PV.diff);return}
  clearTimeout(pvT);pvT=setTimeout(async()=>{const key=[...PV.drop].sort().join();
    try{PV.diff=await post('/api/import/database/diff',{stage:PV.stage,drop:[...PV.drop],full:PV.full});PV.diffKey=key;show(PV.diff)}catch(e){toast(e.message,1)}},500);
}
async function pvCommit(){
  const s=reviewStats();
  const msg=s.n?`Lưu dữ liệu?\n\n• Loại bỏ ${s.dropRows} dòng thừa\n• Giữ nguyên ${s.extra-s.dropRows} dòng trùng${s.unseen?`\n• ${s.unseen} nhóm trùng mới chưa từng được xác nhận`:''}`:'Lưu dữ liệu vào hệ thống?';
  if(!confirm(msg))return;
  $('#uplog').innerHTML='<p class="warn">Đang lưu…</p>';
  try{const d=await post('/api/import/database/commit',{stage:PV.stage,drop:[...PV.drop],full:PV.full});PV=null;
    $('#uplog').innerHTML=`<p class="ok"><b>Đã lưu.</b> ${fmt(d.rows_in_file)} dòng — thêm <b>${fmt(d.added)}</b>, cập nhật <b>${fmt(d.updated)}</b>, không đổi ${fmt(d.unchanged)}, xoá <b>${fmt(d.removed)}</b>${d.duplicates_dropped?`, bỏ ${fmt(d.duplicates_dropped)} dòng trùng`:''}${d.kept_because_already_allocated?`, <span class="warn">giữ lại ${d.kept_because_already_allocated} dòng đã bị trừ lùi nhưng không còn trong file</span>`:''}.</p>`;
    toast('Đã lưu dữ liệu')}catch(e){toast(e.message,1);renderReview()}
}

async function obImport(){
  const sel={};$('#oblog').querySelectorAll('select[data-t]').forEach(s=>{if(s.value)sel[s.dataset.t]=s.value});
  if(!Object.keys(sel).length)return toast('Chọn ít nhất một bảng',1);
  if(!confirm('Nạp sẽ THAY TOÀN BỘ dữ liệu của các bảng đã chọn. Tiếp tục?'))return;
  $('#oblog').innerHTML='<p class="warn">Đang nạp dữ liệu…</p>';
  try{const r=await post('/api/ob/import',{token:OBTOK,selection:sel});
    $('#oblog').innerHTML=`<p class="ok"><b>Đã nạp xong.</b></p><table><tr><th>Bảng</th><th>Sheet</th><th class=n>Trước</th><th class=n>Sau</th><th class=n>Số cột</th></tr>${Object.entries(r).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.sheet)}</td><td class=n>${fmt(v.before)}</td><td class=n>${fmt(v.after)}</td><td class=n>${v.columns}</td></tr>`).join('')}</table>`;
    toast('Đã nạp dữ liệu Outbound')}catch(e){toast(e.message,1);obData()}
}

async function ledgerView(kind){
  const rows=await api('/api/ledger?kind='+kind);
  $('#main').innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">${LTITLE[kind]}</h2><button class="b ${ledMode==='detail'?'':'g'}" onclick="ledMode='detail';go('${cur}')">Chi tiết theo tờ khai</button><button class="b ${ledMode==='sum'?'':'g'}" onclick="ledMode='sum';go('${cur}')">Tổng hợp theo mã hàng</button>
   <a href="/export/kind/${kind}.xlsx"><button class="b g">⬇ Excel toàn bộ</button></a></div>
   <p class="mut">Kết quả trừ lùi của <b>tất cả các lô ${KIND[kind]}</b>: lô đã ghi sổ và lô nháp (dự kiến, ghi rõ ở cột Trạng thái lô — lô nháp chưa trừ vào tồn kho). ${rows.length?'':'Chưa có lô nào.'} Lọc theo từng cột; rê chuột lên ô để xem đầy đủ.</p><div id="ledbox"></div></div>`;
  const key='led_'+kind;
  if(ledMode==='sum'){
    const g={};rows.forEach(r=>{const x=g[r.ma_hang]??=({ma_hang:r.ma_hang,ten_hang:r.ten_hang,dvt:r.dvt,qty:0,tri_gia_usd:0,n_lo:new Set(),n_tk:new Set()});x.qty+=r.qty;x.tri_gia_usd+=r.tri_gia_usd||0;x.n_lo.add(r.lo);x.n_tk.add(r.so_tk)});
    const d=Object.values(g).map(x=>({...x,n_lo:x.n_lo.size,n_tk:x.n_tk.size}));
    miniTable($('#ledbox'),[{k:'ma_hang',l:'Mã hàng',t:'text'},{k:'ten_hang',l:'Tên hàng',t:'text',w:1},{k:'dvt',l:'ĐVT',t:'text'},{k:'qty',l:'Tổng số lượng',t:'number',b:1},{k:'tri_gia_usd',l:'Tổng trị giá (USD)',t:'number'},{k:'n_lo',l:'Số lô',t:'number'},{k:'n_tk',l:'Số tờ khai nhập',t:'number'}],d,'qty',{csv:key+'-tong-hop'});
  }else miniTable($('#ledbox'),[{k:'lo',l:'Lô / INV',t:'text'},{k:'trang_thai',l:'Trạng thái lô',t:'text'},{k:'ngay_tk_xuat',l:'Ngày TK xuất',t:'text'},{k:'so_tk_xuat',l:'TK xuất',t:'text'},...(kind==='CO'?[{k:'so_co',l:'Số C/O',t:'text'}]:[]),
    {k:'so_tk',l:'Tờ khai nhập',t:'text'},{k:'ngay_tk_nhap',l:'Ngày tờ khai',t:'text'},{k:'ma_hang',l:'Mã hàng',t:'text'},{k:'ten_hang',l:'Tên hàng',t:'text',w:1},{k:'dvt',l:'ĐVT',t:'text'},{k:'nuoc_xx',l:'Nước xuất xứ',t:'text'},{k:'ma_hs',l:'Mã HS',t:'text'},
    {k:'qty',l:'Số lượng',t:'number',b:1},{k:'don_gia_cif',l:'Đơn giá CIF (USD)',t:'number'},{k:'ty_gia_usd',l:'Tỷ giá USD/VNĐ',t:'number'},{k:'tri_gia_usd',l:'Trị giá (USD)',t:'number'}],rows,null,{csv:key});
}

function nav(){
  let closed={};try{closed=JSON.parse(localStorage.nvlClosed||'{}')}catch(e){}
  $('#nav').innerHTML=GROUPS.map(g=>{const active=g.items.includes(cur);return `<div class="grp ${closed[g.id]&&!active?'closed':''}"><button class="gh" onclick="toggleGrp('${g.id}')"><span>${g.icon}</span><span>${g.title}</span><span class="ar">▾</span></button><div class="items">${g.items.map(k=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${TABS[k]}</button>`).join('')}</div></div>`}).join('')}
function toggleGrp(id){let c={};try{c=JSON.parse(localStorage.nvlClosed||'{}')}catch(e){}c[id]=!c[id];localStorage.nvlClosed=JSON.stringify(c);document.querySelectorAll('#nav .grp')[GROUPS.findIndex(g=>g.id===id)].classList.toggle('closed',c[id])}
async function go(t,id){cur=t;evId=id||null;if(!id)try{localStorage.nvlPage=t}catch(e){}nav();try{await VIEWS[t]()}catch(e){toast(e.message,1)}}

async eventDetail(){
  const {event:e,plan,short,rows}=await api('/api/events/'+evId);
  const L=e.status==='LOCKED';
  const money=v=>v==null?'':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:4});
  let tot=0,noRate=0;
  const body=rows.map(x=>{tot+=x.tri_gia_usd||0;if(x.so_tk&&x.don_gia_cif==null)noRate++;
    if(x.is_short)return `<tr style="background:rgba(192,57,43,.12)"><td>${x.stt}</td><td>${esc(x.ma_hang)}</td><td class=n>${fmt(x.need)}</td><td colspan=5 class="bad"><b>THIẾU TỒN</b> — không có tờ khai nhập đủ điều kiện</td><td class="n bad">${fmt(x.qty)}</td><td colspan=3></td></tr>`;
    return `<tr><td>${x.stt}</td><td>${esc(x.ma_hang)}</td><td class=n>${fmt(x.need)}</td><td>${esc(x.so_tk)}</td><td>${esc(x.ngay_tk_nhap)}</td><td title="${esc(x.ten_hang)}">${esc((x.ten_hang||'').slice(0,60))}</td><td>${esc(x.nuoc_xx)}</td><td>${esc(x.ma_hs)}</td>
     <td class=n>${fmt(x.qty)}</td><td class=n title="${esc(x.rate_note||'')}">${x.don_gia_cif==null?'<span class=bad>—</span>':money(x.don_gia_cif)}${x.rate_note?' ⚠':''}</td><td class=n>${money(x.ty_gia_usd)}</td><td class=n>${money(x.tri_gia_usd)}</td></tr>`}).join('');
  const f=(k,l)=>`<label>${l}<input id="f_${k}" value="${esc(e[k]??'')}" ${L&&!['co_so','co_ngay'].includes(k)?'disabled':''}></label>`;
  $('#main').innerHTML=`<div class="panel"><div class="row"><button class="b g" onclick="go('events')">← Danh sách</button>
   <h2 style="margin:0">${KIND[e.kind]} · ${esc(e.code)}</h2><span class="tag ${L?'ok':'warn'}">${L?'Đã khoá '+esc(e.locked_at):'Nháp — chưa ghi sổ'}</span>${e.frozen?'<span class="tag ok">Cố định — đã nộp</span>':''}${!e.nhap_tu&&!e.nhap_den?'<span class="tag warn">Chưa giới hạn ngày tờ khai nhập</span>':`<span class="tag">Trừ tờ khai nhập ${esc(e.nhap_tu||'…')} → ${esc(e.nhap_den||'…')}</span>`}
   ${short?`<span class="tag bad">${short} mã thiếu tồn</span>`:`<span class="tag ok">Đủ tồn</span>`}</div>
   <div class="grid2">${f('so_tk_xuat','Số TK xuất')}${f('ngay_tk','Ngày TK xuất')}${f('so_inv','Số INV')}${f('ngay_inv','Ngày INV')}${f('ma_tp','Mã thành phẩm')}${f('hs6','Mã HS 6 số')}${f('fob_usd','FOB (USD)')}${f('co_so','Số C/O')}${f('co_ngay','Ngày C/O')}${f('ten_hang','Tên hàng hoá (thành phẩm)')}${f('tieu_chi','Tiêu chí RVC (vd CTSH + ACU)')}${f('dvt_lo','ĐVT lô hàng')}<label>Số lượng lô<input value="${esc(e.qty_lo??'')}" disabled></label></div>
   <div class="grid2" style="margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:8px">${f('nhap_tu','Trừ tờ khai nhập TỪ ngày (dd/mm/yyyy)')}${f('nhap_den','… ĐẾN ngày')}<span class="mut" style="align-self:end">Chỉ các tờ khai nhập có Ngày ĐK trong khoảng này mới bị trừ. Để trống = không giới hạn. Bấm "Lưu thông tin" để xem lại phương án.</span></div>
   <div class="row" style="margin-top:12px">
   ${L?`<button class="b g" onclick="saveHdr()">Lưu Số/Ngày C/O</button><button class="b g" onclick="freeze(${e.frozen?0:1})">${e.frozen?'Bỏ cố định':'Đánh dấu đã nộp (cố định)'}</button><button class="b d" onclick="unlock()">Huỷ khoá (trả tồn)</button>`:`<button class="b g" onclick="saveHdr(true)">Lưu thông tin</button><button class="b" onclick="lock(${short?'true':'false'})">${short?'Khoá dù thiếu tồn':'Khoá & ghi sổ'}</button><button class="b g" title="Dùng khi bổ sung lô cũ đã nộp hải quan / đã có C/O" onclick="lock(${short?'true':'false'},true)">Khoá &amp; đánh dấu đã nộp</button><button class="b d" onclick="delEvent()">Xoá lô</button>`}
   <a href="/export/lot/${e.id}.xlsx"><button class="b g">⬇ Excel chi tiết lô</button></a>
   ${e.kind==='CO'?`<button class="b" onclick="go('rvc',${e.id})">Xem form RVC</button>`:''}</div>
   ${noRate?`<p class="bad">⚠ ${noRate} dòng chưa tính được Đơn giá CIF (thiếu tỷ giá USD hoặc đơn giá tính thuế).</p>`:''}
   <p class="mut">Đơn giá CIF (USD) = Đơn giá tính thuế (VNĐ) ÷ tỷ giá hải quan USD/VNĐ của đúng ngày tờ khai nhập. Dòng có ⚠: ngày đó không có tỷ giá USD nên dùng ngày gần nhất trước đó (rê chuột để xem).</p>
   <div class="scroll"><table><tr><th>STT</th><th>Mã hàng</th><th class=n>Nhu cầu</th><th>Tờ khai nhập</th><th>Ngày tờ khai</th><th>Tên hàng</th><th>Nước xuất xứ</th><th>Mã HS</th><th class=n>SL trừ</th><th class=n>Đơn giá CIF (USD)</th><th class=n>Tỷ giá USD/VNĐ</th><th class=n>Trị giá (USD)</th></tr>${body}
   <tr><td colspan=11 class=n><b>Tổng trị giá (USD)</b></td><td class=n><b>${money(tot)}</b></td></tr></table></div></div>`;
},

async rvc(){
  const evs=(await api('/api/events')).filter(e=>e.kind==='CO');
  if(!evId&&evs.length)evId=evs[0].id;
  $('#main').innerHTML=`<div class="panel noprint"><div class="row"><h2 style="margin:0">Form RVC — Phụ lục VIII</h2>
   <select id="rvsel">${evs.map(e=>`<option value="${e.id}" ${e.id===evId?'selected':''}>${esc(e.code)} · ${esc(e.ngay_tk||'')} · ${e.status==='LOCKED'?'đã khoá':'nháp'}</option>`).join('')||'<option>Chưa có lô C/O</option>'}</select>
   ${evId?`<a href="/export/rvc/${evId}.xlsx"><button class="b">⬇ Xuất Excel</button></a><button class="b g" onclick="window.print()">🖨 In</button><button class="b g" onclick="go('events',${evId})">Mở lô / sửa thông tin</button>`:''}</div>
   <p class="mut">Form điền đúng theo mẫu sheet RVC trong sổ Excel của bạn: thông tin lô, định mức BOM và từng tờ khai nhập bị trừ. Lô nháp hiển thị phương án dự kiến (chưa ghi sổ).</p></div><div id="rvbox"></div>`;

   <div style="overflow:auto;background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px">${d.html}</div>
   <p class="mut noprint">Các cột Trị giá "Có / Không có xuất xứ FTA" và "C/O ưu đãi nhập khẩu" (Số, Ngày) để trống — điền tay trên file Excel sau khi xuất (dòng Cộng là công thức tự cộng). Tham khảo: tổng trị giá NVL theo đơn giá CIF = ${mny(d.total_usd)} USD (chi tiết từng dòng xem ở trang lô).</p>`;
},
async bom(){
  if(evId)return VIEWS.bomDetail();
  const list=await api('/api/boms');
  $('#main').innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">BOM — định mức NVL cho thành phẩm</h2><button class="b" onclick="bomNew()">+ Tạo BOM</button><a href="/export/bom-template.xlsx"><button class="b g">⬇ File mẫu</button></a></div>
   <p class="mut">BOM = số lượng NVL dùng cho <b>1 đơn vị thành phẩm</b> (Qty used in FG). Khi tạo lô C/O chỉ cần chọn BOM và số lượng lô, hệ thống tự tính nhu cầu NVL = định mức × số lượng lô.</p>
   <div class="row"><input type="file" id="fbom" accept=".xlsx,.xlsm"><button class="b g" onclick="bomUpload(true)">Đọc sheet "BOM" &amp; kiểm tra</button><span class="mut">chọn file có sheet <b>BOM</b> (cả <b>BOM (2)</b>… nếu có — mỗi sheet là một thành phẩm); hoặc file bảng nhiều thành phẩm (xem file mẫu)</span></div>

async function doUp(p,id,isDb){const f=$('#'+id).files[0];if(!f)return toast('Chọn file trước',1);
  const box=$('#uplog');if(box)box.innerHTML='<p class="warn">Đang đọc file và cập nhật… (file lớn mất khoảng 10–60 giây, đừng đóng trang)</p>';
  try{const q=`?filename=${encodeURIComponent(f.name)}`+(isDb?`&full=${$('#full').checked?1:0}`:'');
    const r=await upload(p+q,f);const d=r.database||r;
    if(box)box.innerHTML=`<p class="ok"><b>Cập nhật xong.</b> ${fmt(d.rows_in_file)} dòng trong file — thêm <b>${fmt(d.added)}</b>, cập nhật <b>${fmt(d.updated)}</b>, không đổi ${fmt(d.unchanged)}, xoá <b>${fmt(d.removed)}</b>${d.kept_because_already_allocated?`, <span class="warn">giữ lại ${d.kept_because_already_allocated} dòng không còn trong file vì đã bị trừ lùi (kiểm tra)</span>`:''}.</p>`;
    toast('Đã cập nhật dữ liệu')}catch(e){if(box)box.innerHTML='';toast(e.message,1)}}
async function saveSettings(){const o={};['order','types_co','types_other','only_cleared','priority','company','mst','place','tieu_chi'].forEach(k=>o[k]=$('#s_'+k).value);await post('/api/settings',o);toast('Đã lưu')}
function hdr(){const o={};['so_tk_xuat','ngay_tk','so_inv','ngay_inv','ma_tp','hs6','fob_usd','co_so','co_ngay','nhap_tu','nhap_den','ten_hang','tieu_chi','dvt_lo'].forEach(k=>{const e=$('#f_'+k);if(e)o[k]=e.value});return o}
async function saveHdr(refresh){try{await post(`/api/events/${evId}/update`,hdr());toast('Đã lưu');if(refresh)go('events',evId)}catch(e){toast(e.message,1);throw e}}
async function lock(allow,frozen){if(!confirm(frozen?'Ghi sổ và đánh dấu lô ĐÃ NỘP (cố định, không đổi khi tính lại)?':'Ghi sổ lô này? Tồn kho sẽ bị trừ.'))return;await saveHdr();
  try{const r=await post(`/api/events/${evId}/lock`,{allow_shortfall:allow,frozen:!!frozen});toast('Đã khoá lô');await go('events',evId);
    if(r.rebuild_pending&&confirm(`Lô này có ưu tiên cao hơn ${r.rebuild_pending} lô đã khoá khác (vd lô C/O đến sau lô XK). Xem phương án tính lại?`)){await go('events');rebuildPreview()}}catch(e){toast(e.message,1)}}
async function freeze(v){await post(`/api/events/${evId}/freeze`,{frozen:!!v});go('events',evId)}
async function rebuildPreview(){const r=await post('/api/rebuild/preview');
  $('#rbbox').innerHTML=`<div class="panel" style="border-color:var(--warn)"><h2>Tính lại thứ tự ưu tiên — xem trước</h2><p>Xét ${r.lots_checked} lô đã khoá chưa cố định. ${r.changed.length?`<b>${r.changed.length} lô sẽ thay đổi phương án trừ</b> (tờ khai nhập bị trừ khác đi). Lô nào đã nộp hải quan / đã có C/O thì hãy đánh dấu <i>cố định</i> trước khi áp dụng.`:'Không có lô nào thay đổi.'}</p>
   ${r.changed.length?`<table><tr><th>Lô</th><th>Loại</th><th>Ngày TK</th><th class=n>Dòng NVL đổi</th><th class=n>Thiếu trước</th><th class=n>Thiếu sau</th></tr>`+r.changed.map(c=>`<tr><td><a href="#" onclick="go('events',${c.id});return false">${esc(c.code)}</a></td><td>${KIND[c.kind]}</td><td>${esc(c.ngay_tk)}</td><td class=n>${c.lines_changed}</td><td class=n>${fmt(c.shortfall_before)}</td><td class="n ${c.shortfall_after>c.shortfall_before?'bad':''}">${fmt(c.shortfall_after)}</td></tr>`).join('')+'</table>':''}
   <div class="row" style="margin-top:8px">${r.changed.length?'<button class="b" onclick="rebuildCommit()">Áp dụng tính lại</button>':''}<button class="b d" onclick="$(\'#rbbox\').innerHTML=\'\'">Đóng</button></div></div>`}
async function rebuildCommit(){if(!confirm('Áp dụng? Phương án trừ của các lô liệt kê sẽ thay đổi.'))return;const r=await post('/api/rebuild/commit');toast(`Đã tính lại ${r.changed.length} lô`);go('events')}
async function unlock(){if(!confirm('Huỷ khoá và trả lại tồn kho?'))return;await post(`/api/events/${evId}/unlock`);go('events',evId)}
async function delEvent(){if(!confirm('Xoá lô nháp này?'))return;await post(`/api/events/${evId}/delete`);go('events')}
async function newEvent(){
  const boms=await api('/api/boms');
  $('#form').innerHTML=`<div class="panel"><h2>Tạo lô mới</h2><div class="grid2">
   <label>Loại<select id="n_kind"><option value="CO">C/O (BOM × số lượng lô)</option><option value="XK">Xuất khẩu</option><option value="MDK">Mục đích khác</option><option value="TH">Tiêu huỷ</option></select></label>
   <label>Lấy định mức từ BOM (chỉ lô C/O)<select id="n_bom"><option value="">— không dùng BOM (dán danh sách bên dưới) —</option>${boms.map(b=>`<option value="${b.id}" ${b.id===preBom?'selected':''}>${esc(b.ma_tp)} · ${esc(b.ten_hang||'')} (${b.n_lines} NVL)</option>`).join('')}</select></label>
   <label>Mã lô / số INV<input id="n_code" placeholder="VNOUT00732"></label>
   <label>Số TK xuất<input id="n_tk"></label><label>Ngày TK xuất (dd/mm/yyyy)<input id="n_ntk"></label>
   <label>Mã thành phẩm<input id="n_tp"></label><label>Số lượng lô (C/O)<input id="n_qty" value="1"></label>
   <label>Mã HS 6 số<input id="n_hs"></label><label>FOB (USD)<input id="n_fob"></label>
   <label>Trừ tờ khai nhập TỪ ngày (dd/mm/yyyy)<input id="n_from" placeholder="trống = không giới hạn"></label><label>… ĐẾN ngày<input id="n_to" placeholder="trống = không giới hạn"></label></div>
   <p class="mut">Danh sách NVL — dán từ Excel, mỗi dòng: <b>Mã hàng ⇥ Mô tả (tuỳ chọn) ⇥ Qty ⇥ ĐVT (tuỳ chọn)</b>. Hoặc nhập 2 cột "Mã hàng, Qty".</p>
   <textarea id="n_lines" rows="9" style="width:100%" placeholder="110-00063&#9;Cell 18650&#9;15&#9;EACH"></textarea>
   <div class="row" style="margin-top:8px"><button class="b" onclick="createEvent()">Tạo lô nháp</button>
   <span class="mut">hoặc tải file Excel (cột: Mã hàng, Qty/Số lượng, tuỳ chọn Item description, Unit):</span><input type="file" id="n_file" accept=".xlsx,.xlsm"><button class="b g" onclick="createFromFile()">Tạo từ file</button></div></div>`;
}
async function createFromFile(){const f=$('#n_file').files[0];if(!f||!$('#n_code').value.trim())return toast('Chọn file và nhập mã lô / số INV',1);
  const m={kind:$('#n_kind').value,code:$('#n_code').value.trim(),so_tk_xuat:$('#n_tk').value,ngay_tk:$('#n_ntk').value,ma_tp:$('#n_tp').value,qty_lo:$('#n_qty').value,hs6:$('#n_hs').value,fob_usd:$('#n_fob').value,nhap_tu:$('#n_from').value,nhap_den:$('#n_to').value};
  const qs=new URLSearchParams(Object.fromEntries(Object.entries(m).filter(([k,v])=>v)));
  try{const r=await upload('/api/events/from-file?'+qs,f);go('events',r.id)}catch(e){toast(e.message,1)}}
async function createEvent(){
  const lines=$('#n_lines').value.split('\n').map(l=>l.split('\t').map(x=>x.trim())).filter(c=>c[0]).map(c=>{
    const nums=c.map((x,i)=>[i,parseFloat(x.replace(/,/g,''))]).filter(([i,v])=>i>0&&!isNaN(v)&&/^[\d.,]+$/.test(c[i]));
    const qi=nums.length?nums[0][0]:-1; if(qi<0)return null;
    return {ma_hang:c[0],qty:nums[0][1],mo_ta:qi>=2?c[1]:null,dvt:c[qi+1]||null}}).filter(Boolean);
  try{const r=await post('/api/events',{kind:$('#n_kind').value,code:$('#n_code').value.trim(),so_tk_xuat:$('#n_tk').value,ngay_tk:$('#n_ntk').value,
    so_inv:$('#n_code').value.trim(),ma_tp:$('#n_tp').value,qty_lo:$('#n_qty').value,hs6:$('#n_hs').value,fob_usd:$('#n_fob').value,nhap_tu:$('#n_from').value,nhap_den:$('#n_to').value,bom_id:$('#n_kind').value==='CO'?($('#n_bom').value||null):null,lines});preBom=null;go('events',r.id)}catch(e){toast(e.message,1)}}
nav();go((()=>{try{const p=localStorage.nvlPage;return TABS[p]?p:'home'}catch(e){return 'home'}})());
</script>
